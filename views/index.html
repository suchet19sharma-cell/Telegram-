<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h2>Chats</h2>
            </div>
            <ul class="chat-list">
                <li class="chat-item active">
                    <img src="https://i.pravatar.cc/50?img=1" alt="User Avatar">
                    <div class="chat-info">
                        <div class="chat-name">John Doe</div>
                        <div class="last-message">Hello there!</div>
                    </div>
                </li>
                <li class="chat-item">
                    <img src="https://i.pravatar.cc/50?img=2" alt="User Avatar">
                    <div class="chat-info">
                        <div class="chat-name">Jane Smith</div>
                        <div class="last-message">See you later!</div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="main-content">
            <div class="chat-header">
                <h3>John Doe</h3>
            </div>
            <div class="chat-messages">
                <div class="message received">
                    <p>Hello there!</p>
                </div>
                <div class="message sent">
                    <p>Hi! How are you?</p>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
                <button>Send</button>
            </div>
        </div>
    </div>
</body>
</html>
