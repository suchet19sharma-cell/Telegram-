<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h2>Chats</h2>
            </div>
            <ul class="chat-list">
                <!-- User list will be populated here -->
            </ul>
        </div>
        <div class="main-content">
            <div class="chat-header">
                <h3>John Doe</h3>
            </div>
            <div class="chat-messages">
                <div class="message received">
                    <p>Hello there!</p>
                </div>
                <div class="message sent">
                    <p>Hi! How are you?</p>
                </div>
            </div>
            <div class="typing-indicator"></div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
                <button>Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const chatInput = document.querySelector('.chat-input input');
        const sendButton = document.querySelector('.chat-input button');
        const chatMessages = document.querySelector('.chat-messages');

        let typingTimer;
        const TYPING_TIMER_LENGTH = 2000; // 2 seconds

        chatInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            socket.emit('typing');
            typingTimer = setTimeout(() => {
                socket.emit('stop typing');
            }, TYPING_TIMER_LENGTH);
        });

        sendButton.addEventListener('click', () => {
            const message = chatInput.value;
            if (message) {
                socket.emit('chatMessage', message);
                chatInput.value = '';
            }
        });

        socket.on('chatMessage', (data) => {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'received'); // For now, all received messages are styled the same

            const usernameElement = document.createElement('strong');
            usernameElement.textContent = data.username;

            const messageTextElement = document.createElement('p');
            messageTextElement.textContent = data.text;

            messageElement.appendChild(usernameElement);
            messageElement.appendChild(messageTextElement);

            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        const userList = document.querySelector('.chat-list');
        const typingIndicator = document.querySelector('.typing-indicator');

        socket.on('updateUserList', (users) => {
            userList.innerHTML = '';
            users.forEach(user => {
                const userElement = document.createElement('li');
                userElement.classList.add('chat-item');
                userElement.innerHTML = `
                    <img src="https://i.pravatar.cc/50?u=${user}" alt="User Avatar">
                    <div class="chat-info">
                        <div class="chat-name">${user}</div>
                    </div>
                `;
                userList.appendChild(userElement);
            });
        });

        socket.on('typing', (data) => {
            typingIndicator.textContent = `${data.username} is typing...`;
        });

        socket.on('stop typing', (data) => {
            typingIndicator.textContent = '';
        });
    </script>
</body>
</html>
